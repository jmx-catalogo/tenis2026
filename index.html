<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JMx Tenis</title>
<style>
  /* ── FUENTES ── */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #888;
    --accent: #c8f135;
    --accent-dark: #a8d020;
    --wa: #25d366;
    --radius: 16px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 1.25rem;
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    gap: 1rem;
  }
  .logo {
    font-size: 1.3rem;
    font-weight: 900;
    letter-spacing: -0.03em;
    color: var(--text);
    white-space: nowrap;
  }
  .logo span { color: var(--accent); }

  /* ── BARRA DE BÚSQUEDA ── */
  .search-wrap {
    flex: 1;
    max-width: 340px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  #search {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.55rem 1rem 0.55rem 2.5rem;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--accent); }

  /* ── HERO ── */
  .hero {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.25rem 1.25rem 1rem;
  }
  .hero h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1.05;
    margin-bottom: 0.3rem;
  }
  .hero h1 em {
    font-style: normal;
    color: var(--accent);
  }
  .hero p {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 0.75rem;
  }

  /* ── FILTROS (estilo dropdown, Apple Store) ── */
  .filters-section {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.25rem 1.5rem;
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    position: relative;
  }
  .filter-dropdown { position: relative; }

  .filter-chip {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.45rem 1rem;
    font-size: 0.83rem;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    white-space: nowrap;
  }
  .filter-chip:hover { border-color: #444; }
  .filter-chip.has-value {
    background: rgba(200,241,53,0.12);
    border-color: var(--accent);
    color: var(--accent);
  }
  .filter-chip .chevron {
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .filter-chip.open .chevron { transform: rotate(180deg); }

  .filter-panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    padding: 0.5rem;
    min-width: 180px;
    max-height: 280px;
    overflow-y: auto;
    z-index: 200;
    display: none;
  }
  .filter-panel.open { display: block; }

  .filter-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius);
    font-size: 0.85rem;
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s;
    font-family: inherit;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
  }
  .filter-option:hover { background: var(--surface2); }
  .filter-option.selected { color: var(--accent); font-weight: 600; }
  .filter-option .check {
    opacity: 0;
    color: var(--accent);
  }
  .filter-option.selected .check { opacity: 1; }

  .filter-clear-all {
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.45rem 1rem;
    font-size: 0.83rem;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .filter-clear-all:hover { border-color: #ff6b6b; color: #ff6b6b; }
  .filter-clear-all.hidden { display: none; }

  /* ── RESULTADOS ── */
  .results-bar {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.25rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .results-count {
    font-size: 0.82rem;
    color: var(--muted);
  }
  .results-count strong { color: var(--accent); }

  /* ── GRID DE PRODUCTOS ── */
  .grid {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.25rem 6rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
  }

  /* ── TARJETA ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform 0.6s, border-color 0.6s;
    display: flex;
    flex-direction: column;
    position: relative;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: #444;
  }
  .card-img {
    aspect-ratio: 1 / 1;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .card-img-overlay {
    position: absolute;
    inset: 0;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.6s;
    pointer-events: none;
     z-index: 2;
  }
  .card:hover .card-img-overlay {
    opacity: 1;
}

.card:hover .card-img-overlay span {
    opacity: 1;
    transform: translateY(0);
}
  .card-img-overlay span{
    color:#fff;
    font-size:16px;
    font-weight:600;
    text-shadow: 0 2px 10px rgba(0,0,0,.45);

    opacity:0;
    transform:translateY(8px);

    transition:all .6s ease;
  }
  .card-img img {
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .6s cubic-bezier(.22,.61,.36,1);;
    z-index: 1;
  }
  .card:hover .card-img img{
    transform:scale(1.02);
}

  .card-img .placeholder-icon {
    font-size: 3rem;
    opacity: 0.18;
  }
  .card-body {
    padding: 0.7rem 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    flex: 1;
  }
  .card-brand {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
  }
  .card-name {
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-top: 0.2rem;
  }
  .tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.72rem;
    padding: 0.15rem 0.5rem;
    color: var(--muted);
  }
  .card-footer {
    padding: 0 1rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .price {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.02em;
  }
  .disponible {
    font-size: 0.68rem;
    font-weight: 500;
    padding: 0;
    text-transform: uppercase;
    letter-spacing: 0;
    margin-top: 2px;
  }
  .disponible.si { background: none; color: var(--accent); }
  .disponible.no { background: none; color: #ff6b6b; }

  /* ── BOTÓN PEDIR POR WHATSAPP ── */
  .wa-btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--wa);
    color: #fff;
    font-size: 0.82rem;
    font-weight: 700;
    padding: 0.75rem 1rem;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, transform 0.1s;
    font-family: inherit;
    white-space: nowrap;
  }
  .wa-btn:hover { background: #1ebe5d; }
  .wa-btn:active { transform: scale(0.97); }
  .wa-btn svg { flex-shrink: 0; }
  .explore-btn {
display: inline-block;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 0.3rem 0.7rem;
  color: var(--muted);
  margin-top: 0.2rem;
  width: fit-content;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s, transform 0.1s;
}
.explore-btn:hover { background: #2a2a2a; }
.explore-btn:active { background: #333; transform: scale(0.97); }

  /* ── VACÍO ── */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 4rem 1rem;
    color: var(--muted);
  }
  .empty .empty-icon { font-size: 3rem; opacity: 0.3; margin-bottom: 1rem; }
  .empty p { font-size: 0.95rem; }

  /* ── FOOTER ── */
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 300;
    background: rgba(10,10,10,0.95);
    border-top: 1px solid var(--border);
    padding: 0.75rem 1.25rem;
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    backdrop-filter: blur(8px);
  }
  footer a {
    color: var(--wa);
    text-decoration: none;
    font-weight: 600;
  }

  /* ── MODAL DE PRODUCTO ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: none;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    padding: 2rem 1rem;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-width: 760px;
    width: 100%;
    overflow: hidden;
    position: relative;
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    z-index: 10;
    background: rgba(10,10,10,0.6);
    backdrop-filter: blur(6px);
    border: none;
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .modal-close:hover { background: rgba(10,10,10,0.85); }

  .modal-gallery {
    display: flex;
    flex-direction: column;
  }
  .modal-gallery-main {
    aspect-ratio: 4 / 3;
    background: var(--surface2);
    overflow: hidden;
  }
  .modal-gallery-main img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .modal-gallery-thumbs {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem;
    overflow-x: auto;
  }
  .modal-thumb {
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid transparent;
    cursor: pointer;
    opacity: 0.6;
    transition: all 0.15s;
  }
  .modal-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .modal-thumb.active { border-color: var(--accent); opacity: 1; }

  .modal-content {
    padding: 0.5rem 1.5rem 1.5rem;
  }
  .modal-brand {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 0.3rem;
  }
  .modal-name {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
  }
  .modal-price-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .modal-price {
    font-size: 1.6rem;
    font-weight: 800;
  }
  .modal-disponible {
    font-size: 0.8rem;
    font-weight: 600;
  }
  .modal-disponible.si { color: var(--accent); }
  .modal-disponible.no { color: #ff6b6b; }

  .modal-desc {
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--muted);
    margin-bottom: 1.25rem;
  }

  .modal-section-label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  .modal-tallas {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 1.25rem;
  }
  .modal-talla {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.4rem 0.9rem;
  font-size: 0.85rem;
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.modal-talla:hover { border-color: #444; }
.modal-talla.selected {
  background: var(--accent);
  border-color: var(--accent);
  color: #0a0a0a;
  font-weight: 700;
}

  .modal-wa-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    background: var(--wa);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    padding: 1rem;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    text-decoration: none;
    width: 100%;
    transition: background 0.15s, transform 0.1s;
    margin-bottom: 1.75rem;
  }
  .modal-wa-btn:hover { background: #1ebe5d; }
  .modal-wa-btn:active { transform: scale(0.98); }

  .modal-related-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 0.75rem;
  }
  .modal-related-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .modal-related-card:hover { border-color: #444; }
  .modal-related-img {
    aspect-ratio: 1/1;
    overflow: hidden;
  }
  .modal-related-img img { width: 100%; height: 100%; object-fit: cover; }
  .modal-related-info { padding: 0.5rem 0.6rem; }
  .modal-related-name {
    font-size: 0.75rem;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 0.15rem;
  }
  .modal-related-price {
    font-size: 0.78rem;
    color: var(--accent);
    font-weight: 700;
  }

  body.modal-locked { overflow: hidden; }

  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
    .hero h1 { font-size: 2rem; }
    .wa-btn { padding: 0.65rem 0.85rem; font-size: 0.78rem; }
    .card-footer { padding: 0 0.85rem 0.85rem; }
    .modal-overlay { padding: 0; align-items: stretch; }
.modal {
  max-width: 100%;
  border-radius: 0;
  min-height: 100vh;
  max-height: 100vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">JM<span>x</span> Tenis</div>
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Buscar modelo o marca" autocomplete="off">
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Catálogo <em>2026</em></h1>
    <p>Encuentra modelos disponibles en existencia. Actualizado constantemente.</p>
  </section>

  <section class="filters-section" id="filters-section"></section>

  <div class="results-bar">
    <span class="results-count">Mostrando <strong id="count">0</strong> modelos</span>
  </div>

  <div class="grid" id="grid"></div>
</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Cerrar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div id="modal-body"></div>
  </div>
</div>

<footer>
  ¿Necesitas más información? <a id="footer-wa" href="#">Escríbenos por WhatsApp</a>
</footer>

<script>
/* ═══════════════════════════════════════════════════════
   NÚMERO DE WHATSAPP
   → Cambia el número aquí abajo (solo dígitos, con código de país)
   → México = 52 + tu número de 10 dígitos
   → Ejemplo: 5216861234567
═══════════════════════════════════════════════════════ */
const WHATSAPP = "526861885835";

/* ═══════════════════════════════════════════════════════
   PRODUCTOS
   → Agrega, edita o elimina productos aquí
   → "imagenes" es una lista — puedes poner 1 o varias fotos
   → La primera imagen es la que se ve en la tarjeta del catálogo
   → "descripcion" aparece en el detalle del producto
   → Precios en pesos mexicanos (sin el $)
═══════════════════════════════════════════════════════ */
const productos = [
  {
    id: 1,
    marca: "Onitsuka Tiger",
    nombre: "Mexico 66",
    color: "Amarillo/Negro",
    tallas: ["26"],
    precio: 1850,
    disponible: true,
    descripcion: "El modelo que puso a Onitsuka Tiger en el radar. Con un diseño estilizado, colorway icónico y alta comodidad desde el primer uso.",
    imagenes: [
      "https://i.ibb.co/6cZgyNfk/IMG-8784.jpg",
      "https://i.ibb.co/vvYgjQVX/IMG-8782.jpg",
      "https://i.ibb.co/jPv347pj/IMG-8781.jpg"
    ]
  },
  
  {
    id: 2,
    marca: "Onitsuka Tiger",
    nombre: "Mexico 66",
    color: "Negro/Gris",
    tallas: ["26", "27"],
    precio: 1850,
    disponible: true,
    descripcion: "El modelo que puso a Onitsuka Tiger en el radar. El acabado negro brillante combina su silueta retro con una comodidad que se disfruta desde el primer uso.",
    imagenes: [
      "https://i.ibb.co/VWNDTWZ2/IMG-8792.jpg",
      "https://i.ibb.co/9HKNL8Tf/IMG-8795.jpg",
      "https://i.ibb.co/ccrM318Z/IMG-8791.jpg",
    ]
  },

  {
    id: 3,
    marca: "Onitsuka Tiger",
    nombre: "Mexico 66",
    color: "Negro/Blanco",
    tallas: ["26", "27"],
    precio: 1850,
    disponible: true,
    descripcion: "El modelo que puso a Onitsuka Tiger en el radar. Un diseño ligero, altamente cómodo y fácil de combinar gracias a su clásico colorway en negro y blanco.",
    imagenes: [
      "https://i.ibb.co/fztnPZhp/IMG-8786.jpg",
      "https://i.ibb.co/vxb13s8c/IMG-8788.jpg",
      "https://i.ibb.co/Tx3KhvMH/IMG-8785.jpg",
    ]
  },

];

/* ─── lógica ─── */
let filtros = { marca: "all", talla: "all", color: "all", disp: "all" };
let busqueda = "";

const FILTER_DEFS = [
  { key: "marca", label: "Marca", getValues: () => [...new Set(productos.map(p => p.marca))].sort() },
  { key: "talla", label: "Talla", getValues: () => [...new Set(productos.flatMap(p => p.tallas))].sort((a,b) => parseFloat(a)-parseFloat(b)) },
  { key: "color", label: "Color", getValues: () => [...new Set(productos.flatMap(p => p.color.split("/").map(c => c.trim())))].sort() },
  { key: "disp", label: "Disponible", getValues: () => ["si", "no"], display: v => v === "si" ? "Disponible" : "Agotado" },
];

function waLink(producto, talla) {
  const tallaTxt = talla ? `, talla ${talla}` : "";
  const msg = encodeURIComponent(`Hola! Me interesa el modelo ${producto.nombre} (${producto.marca}) color ${producto.color}${tallaTxt} que vi en el catálogo. ¿Puedes darme más información?`);
  return `https://wa.me/${WHATSAPP}?text=${msg}`;
}

function buildFilters() {
  const container = document.getElementById("filters-section");
  container.innerHTML = FILTER_DEFS.map(def => `
    <div class="filter-dropdown" data-key="${def.key}">
      <button class="filter-chip" data-key="${def.key}">
        <span class="chip-label">${def.label}</span>
        <svg class="chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="filter-panel" data-key="${def.key}">
        <button class="filter-option selected" data-value="all">
          <span>Todos</span><span class="check">✓</span>
        </button>
        ${def.getValues().map(v => `
          <button class="filter-option" data-value="${v}">
            <span>${def.display ? def.display(v) : v}</span><span class="check">✓</span>
          </button>
        `).join("")}
      </div>
    </div>
  `).join("") + `<button class="filter-clear-all hidden" id="clear-all">Limpiar filtros</button>`;

  // toggle open/close
  container.querySelectorAll(".filter-chip").forEach(chip => {
    chip.addEventListener("click", e => {
      e.stopPropagation();
      const key = chip.dataset.key;
      const panel = container.querySelector(`.filter-panel[data-key="${key}"]`);
      const isOpen = panel.classList.contains("open");
      closeAllPanels();
      if (!isOpen) { panel.classList.add("open"); chip.classList.add("open"); }
    });
  });

  // select option
  container.querySelectorAll(".filter-option").forEach(opt => {
    opt.addEventListener("click", e => {
      e.stopPropagation();
      const key = opt.closest(".filter-panel").dataset.key;
      filtros[key] = opt.dataset.value;
      closeAllPanels();
      updateFilterUI();
      render();
    });
  });

  document.getElementById("clear-all").addEventListener("click", () => {
    Object.keys(filtros).forEach(k => filtros[k] = "all");
    updateFilterUI();
    render();
  });

  document.addEventListener("click", closeAllPanels);
}

function closeAllPanels() {
  document.querySelectorAll(".filter-panel.open").forEach(p => p.classList.remove("open"));
  document.querySelectorAll(".filter-chip.open").forEach(c => c.classList.remove("open"));
}

function updateFilterUI() {
  FILTER_DEFS.forEach(def => {
    const value = filtros[def.key];
    const chip = document.querySelector(`.filter-chip[data-key="${def.key}"]`);
    const panel = document.querySelector(`.filter-panel[data-key="${def.key}"]`);
    const label = chip.querySelector(".chip-label");

    panel.querySelectorAll(".filter-option").forEach(o => o.classList.toggle("selected", o.dataset.value === value));

    if (value === "all") {
      chip.classList.remove("has-value");
      label.textContent = def.label;
    } else {
      chip.classList.add("has-value");
      label.textContent = def.display ? def.display(value) : value;
    }
  });

  const anyActive = Object.values(filtros).some(v => v !== "all");
  document.getElementById("clear-all").classList.toggle("hidden", !anyActive);
}

function render() {
  const q = busqueda.toLowerCase();
  const filtered = productos.filter(p => {
    if (filtros.marca !== "all" && p.marca !== filtros.marca) return false;
    if (filtros.talla !== "all" && !p.tallas.includes(filtros.talla)) return false;
    if (filtros.color !== "all" && !p.color.split("/").map(c => c.trim()).includes(filtros.color)) return false;
    if (filtros.disp !== "all" && (p.disponible ? "si" : "no") !== filtros.disp) return false;
    if (q && !p.nombre.toLowerCase().includes(q) && !p.marca.toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById("count").textContent = filtered.length;
  const grid = document.getElementById("grid");

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">👟</div><p>No hay modelos con esos filtros.<br>Intenta con otras opciones.</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => `
    <div class="card" data-id="${p.id}">
      <div class="card-img">
        ${p.imagenes && p.imagenes[0]
          ? `<img src="${p.imagenes[0]}" alt="${p.nombre}" loading="lazy">`
          : `<span class="placeholder-icon">👟</span>`}
        <div class="card-img-overlay"><span></span></div>
      </div>
      <div class="card-body">
        <div class="card-brand">${p.marca}</div>
        <div class="card-name">${p.nombre}</div>
        <span class="explore-btn" onclick="event.stopPropagation(); openModal(${p.id})">Explorar →</span>
      </div>
      <div class="card-footer">
        <div>
          <div class="price">$${p.precio.toLocaleString()}</div>
          <div class="disponible ${p.disponible ? "si" : "no"}">${p.disponible ? "Disponible" : "Agotado"}</div>
        </div>
        ${p.disponible
          ? `<a class="wa-btn" href="${waLink(p)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
               <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.092.539 4.057 1.481 5.771L0 24l6.385-1.463A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.002-1.371l-.359-.214-3.722.853.886-3.617-.234-.371A9.818 9.818 0 1112 21.818z"/></svg>
               Pedir
             </a>`
          : ""}
      </div>
    </div>
  `).join("");

  grid.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openModal(parseInt(card.dataset.id)));
  });
}

/* ─── MODAL DE PRODUCTO ─── */
function getRelacionados(p) {
  const candidatos = productos.filter(x => x.id !== p.id && x.disponible);
  // priorizar coincidencias por marca o color en común
  const conCoincidencia = candidatos.filter(x =>
    x.marca === p.marca || x.colores.some(c => p.colores.includes(c))
  );
  const resto = candidatos.filter(x => !conCoincidencia.includes(x));
  const mezcla = [...conCoincidencia.sort(() => Math.random() - 0.5), ...resto.sort(() => Math.random() - 0.5)];
  return mezcla.slice(0, 4);
}

function openModal(id) {
  const p = productos.find(x => x.id === id);
  if (!p) return;

  const imgs = p.imagenes && p.imagenes.length ? p.imagenes : [];
  const relacionados = getRelacionados(p);

  document.getElementById("modal-body").innerHTML = `
    <div class="modal-gallery">
      <div class="modal-gallery-main">
        ${imgs.length
          ? `<img id="modal-main-img" src="${imgs[0]}" alt="${p.nombre}">`
          : `<span class="placeholder-icon" style="font-size:4rem;display:flex;align-items:center;justify-content:center;height:100%;opacity:0.18">👟</span>`}
      </div>
      ${imgs.length > 1 ? `
        <div class="modal-gallery-thumbs">
          ${imgs.map((src, i) => `
            <div class="modal-thumb ${i === 0 ? "active" : ""}" data-src="${src}">
              <img src="${src}" alt="">
            </div>
          `).join("")}
        </div>
      ` : ""}
    </div>

    <div class="modal-content">
      <div class="modal-brand">${p.marca}</div>
      <div class="modal-name">${p.nombre}</div>
      <div class="modal-price-row">
        <span class="modal-price">$${p.precio.toLocaleString()}</span>
        <span class="modal-disponible ${p.disponible ? "si" : "no"}">${p.disponible ? "Disponible" : "Agotado"}</span>
      </div>

      ${p.descripcion ? `<p class="modal-desc">${p.descripcion}</p>` : ""}

      <div class="modal-section-label">Selecciona tu talla</div>
      <div class="modal-tallas">
      ${p.tallas.map(t => `<button class="modal-talla" data-talla="${t}">${t}</button>`).join("")}
      </div>

      ${p.disponible ? `
        <a class="modal-wa-btn" id="modal-wa-btn" href="${waLink(p)}" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.092.539 4.057 1.481 5.771L0 24l6.385-1.463A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.002-1.371l-.359-.214-3.722.853.886-3.617-.234-.371A9.818 9.818 0 1112 21.818z"/></svg>
          Pedir por WhatsApp
        </a>
      ` : ""}

      ${relacionados.length ? `
        <div class="modal-section-label">También te puede interesar</div>
        <div class="modal-related-grid">
          ${relacionados.map(r => `
            <div class="modal-related-card" data-id="${r.id}">
              <div class="modal-related-img">
                ${r.imagenes && r.imagenes[0]
                  ? `<img src="${r.imagenes[0]}" alt="${r.nombre}">`
                  : `<span class="placeholder-icon">👟</span>`}
              </div>
              <div class="modal-related-info">
                <div class="modal-related-name">${r.nombre}</div>
                <div class="modal-related-price">$${r.precio.toLocaleString()}</div>
              </div>
            </div>
          `).join("")}
        </div>
      ` : ""}
    </div>
  `;

  // thumbnails
  document.querySelectorAll(".modal-thumb").forEach(thumb => {
    thumb.addEventListener("click", () => {
      document.getElementById("modal-main-img").src = thumb.dataset.src;
      document.querySelectorAll(".modal-thumb").forEach(t => t.classList.remove("active"));
      thumb.classList.add("active");
    });
  });

  // selección de talla
let tallaSeleccionada = null;
document.querySelectorAll(".modal-talla").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".modal-talla").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    tallaSeleccionada = btn.dataset.talla;
    const waBtn = document.getElementById("modal-wa-btn");
    if (waBtn) waBtn.href = waLink(p, tallaSeleccionada);
  });
});

  // productos relacionados -> abrir su propio modal
  document.querySelectorAll(".modal-related-card").forEach(card => {
    card.addEventListener("click", () => openModal(parseInt(card.dataset.id)));
  });

  document.getElementById("modal-overlay").classList.add("open");
  document.getElementById("modal").scrollTop = 0;
  document.body.classList.add("modal-locked");
}

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
  document.body.classList.remove("modal-locked");
}

document.getElementById("modal-close").addEventListener("click", closeModal);
document.getElementById("modal-overlay").addEventListener("click", e => {
  if (e.target.id === "modal-overlay") closeModal();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

document.getElementById("search").addEventListener("input", e => { busqueda = e.target.value; render(); });
document.getElementById("footer-wa").href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Hola! Vi su catálogo y quiero más información.")}`;

buildFilters();
render();
</script>
</body>
</html>
